<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>くるりAI 机シーン検証</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #173a30;
        overflow: hidden;
      }

      #desk {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 10px;
        font:
          12px/1.5 "Hiragino Sans",
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        color: #e9f0ec;
        background: rgb(23 58 48 / 0.82);
        border-radius: 2px;
        white-space: pre;
        pointer-events: none;
      }

      #hud[hidden] {
        display: none;
      }

      #loupe {
        position: fixed;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 2px solid #c9ccc8;
        border-radius: 50%;
        pointer-events: none;
      }

      #loupe[hidden] {
        display: none;
      }

      #ui-mock {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .ui-block {
        position: absolute;
        background: rgb(23 58 48 / 0.38);
        box-shadow: inset 0 0 0 1px rgb(233 240 236 / 0.18);
      }

      .ui-free {
        position: absolute;
        box-sizing: border-box;
        border: 1px dashed rgb(247 245 239 / 0.55);
      }

      body.clean #ui-mock {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="desk"></canvas>
    <div id="ui-mock"></div>
    <div id="loupe" hidden></div>
    <div id="hud" hidden></div>
    <script type="module" src="./scene-harness.ts"></script>
  </body>
</html>
