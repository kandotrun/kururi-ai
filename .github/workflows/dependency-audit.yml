name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          version: "0.10.12"
      - name: Audit locked Python dependencies
        working-directory: cli
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.12 pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Audit web dependencies
        working-directory: web
        run: npm ci && npm audit --audit-level=low
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native
