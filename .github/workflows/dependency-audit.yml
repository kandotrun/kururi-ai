name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.10.12"
      - name: Audit locked Python dependencies
        working-directory: cli
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.12 --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
      - name: Audit native Python dependencies
        run: |
          uv pip compile native/requirements-native.txt --python-version 3.12 --quiet --output-file "$RUNNER_TEMP/native-requirements.txt"
          uvx --python 3.12 --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/native-requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
      - name: Audit training Python dependencies
        run: |
          uv pip compile training/requirements-training.txt --python-version 3.12 --quiet --output-file "$RUNNER_TEMP/training-requirements.txt"
          uvx --python 3.12 --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/training-requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Audit web dependencies
        working-directory: web
        run: npm ci && npm audit --audit-level=low
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native
