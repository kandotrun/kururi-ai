[project]
name = "cli"
version = "0.1.0"
description = "くるりAIのCLIバージョンです。"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.18.0",
    "timm>=0.9.16",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "pytest>=8.3.0",
]

[tool.setuptools]
packages = ["cli"]
package-dir = { "cli" = "." }

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "filelock>=3.20.3",
    "fsspec>=2026.6.0",
    "idna>=3.15",
    "setuptools>=83.0.0",
]
